<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="조조전">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="data/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@700&display=swap" rel="stylesheet">
<title>삼국지 조조전 (리메이크 엔진)</title>
<style>
  :root { --bar: 64px; --side: 30px; --btn-bg: rgba(255,255,255,.10); --btn-bd: rgba(255,255,255,.22); --fg: #e8e8e8;
    --vw: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
    --vh: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  @supports (height: 100dvh) { :root { --vh: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); } }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* 비율 유지: 높이를 꽉 쓰고 남는 폭은 양옆 (왼쪽 명성 · 오른쪽 버튼) */
  #screen { image-rendering: pixelated; background: #000; touch-action: none; display: block;
    width: min(calc(var(--vw) - var(--bar) - var(--side)), calc(var(--vh) * 4 / 3));
    height: min(var(--vh), calc((var(--vw) - var(--bar) - var(--side)) * 3 / 4)); }
  /* 꽉 채우기: 비율을 늘여 남는 곳 없이 */
  body.fill #screen { width: calc(var(--vw) - var(--bar) - var(--side)); height: var(--vh); }
  #bar { width: var(--bar); height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 3px; align-items: center; }
  #bar button { width: 54px; height: 30px; border-radius: 12px; border: 1px solid var(--btn-bd);
    background: var(--btn-bg); color: var(--fg); font-size: 12px; font-weight: 600; line-height: 1.15; padding: 0; touch-action: manipulation; }
  #bar button:active, #bar button.on { background: rgba(255,255,255,.32); }
  #bar #cancel { height: 40px; background: rgba(220,80,80,.25); border-color: rgba(255,120,120,.5); }
  /* 명성 게이지 (원작 상태줄 200×8, MARK 무늬) — 왼쪽에 세로로 */
  #fame { width: var(--side); height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; }
  #fameBox { width: 12px; height: 204px; position: relative; }
  #fameCv { position: absolute; left: 50%; top: 50%; width: 200px; height: 10px; transform: translate(-50%, -50%) rotate(-90deg);
    image-rendering: pixelated; background: #000; border: 1px solid var(--btn-bd); }
  #fame.blink #fameCv { opacity: .45; }
  #fameLabel { writing-mode: vertical-rl; letter-spacing: 2px; }
  #movie { display: none; position: fixed; inset: 0; z-index: 10; width: 100%; height: 100%; background: #000; object-fit: contain; }
  #movie.on { display: block; }
  #status { pointer-events: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 15px; text-align: center;
    background: rgba(0,0,0,.7); padding: 14px 20px; border-radius: 12px; border: 1px solid var(--btn-bd); }
  #status:empty { display: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #000;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; font-size: 17px; }
  /* 세로 배치: 위 화면, 아래 명성 막대와 버튼 */
  body.port #app { flex-direction: column; justify-content: flex-start; gap: 6px; }
  body.port #screen { order: 0; width: var(--vw); height: calc(var(--vw) * 3 / 4); }
  body.port.fill #screen { width: var(--vw); height: min(calc(var(--vh) - 170px), calc(var(--vw) * 1.1)); }
  body.port #fame { order: 1; width: var(--vw); height: 22px; flex-direction: row; gap: 8px; }
  body.port #fameBox { width: 204px; height: 12px; }
  body.port #fameCv { transform: translate(-50%, -50%); }
  body.port #fameLabel { writing-mode: horizontal-tb; letter-spacing: 0; }
  body.port #bar { order: 2; width: var(--vw); height: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 6px 10px; box-sizing: border-box; }
  body.port #bar button { width: 100%; height: 52px; font-size: 15px; }
  body.port #bar #cancel { height: 52px; }
  /* 폰이 화면 방향 고정을 못 하면 (아이폰) 앱 전체를 90도 돌려서 맞춤 */
  body.rotcw #app, body.rotccw #app { inset: auto; width: 100vh; height: 100vw; top: 0; padding: 0; transform-origin: top left; }
  body.rotcw #app { left: 100vw; transform: rotate(90deg); }
  body.rotccw #app { left: 0; top: 100vh; transform: rotate(-90deg); }

  .tog { font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--btn-bd); background: var(--btn-bg); color: var(--fg); font-weight: 600; text-align: left; }
  #slots { position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.6); align-items: center; justify-content: center; }
  .slotBox { background: #1c1712; border: 1px solid #8a6a3b; border-radius: 14px; padding: 14px; width: min(420px, 90vw); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  #slotList, #slotExtra { display: flex; flex-direction: column; gap: 6px; }
  #slotExtra { flex-direction: row; flex-wrap: wrap; }
  .slot { text-align: left; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--btn-bd); background: var(--btn-bg); color: var(--fg); }
  .slot b { display: inline-block; width: 22px; color: #e0b060; }
  .slot small { display: block; opacity: .6; font-size: 12px; margin-left: 22px; }
  .slot:disabled { opacity: .5; }
  .slot.small { flex: 1; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div id="fame"><span id="fameNum">0</span><div id="fameBox"><canvas id="fameCv" width="200" height="8"></canvas></div><span id="fameLabel">명성</span></div>
  <canvas id="screen" width="640" height="480"></canvas>
  <div id="bar">
    <button id="fast">속도<br>×1</button>
    <button id="menu">메뉴</button>
    <button id="save">저장</button>
    <button id="map">지도</button>
    <button id="snd">설정</button>
    <button id="cancel">취소</button>
    <button id="skip">넘기기</button>
  </div>

<video id="movie" playsinline preload="none"></video>
<div id="soundHint" style="position:fixed;left:8px;bottom:8px;font-size:12px;opacity:.7;pointer-events:none">🔇 화면을 누르면 소리가 켜집니다</div>
<div id="toast" style="display:none;position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.3);padding:10px 16px;border-radius:10px;font-size:15px;z-index:30;pointer-events:none"></div>
<button id="update" style="display:none;position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:40;background:#8a5a2b;color:#fff;border:1px solid #c08040;border-radius:10px;padding:10px 16px;font-size:15px">새 버전이 있습니다 — 눌러서 새로고침</button>
<div id="sndPanel" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:35;background:rgba(20,20,20,.94);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px;display:none;flex-direction:column;gap:8px;min-width:200px">
  <button id="sndBgm" class="tog"></button>
  <button id="sndSfx" class="tog"></button>
  <div style="font-size:12px;opacity:.75;line-height:1.4">배경음악을 끄면 폰에서 듣던<br>다른 음악이 멈추지 않고 같이 납니다</div>
  <button id="orient" class="tog"></button>
  <button id="fit" class="tog"></button>
  <button id="full" class="tog">전체 화면</button>
  <button id="sndClose" class="tog">닫기</button>
</div>
<div id="slots" style="display:none"><div class="slotBox">
  <div id="slotTitle" style="font-size:16px;font-weight:700;margin-bottom:4px"></div>
  <div id="slotList"></div>
  <div id="slotExtra"></div>
</div></div>
<div id="status">불러오는 중…</div>
</div>
<script src="ekd5.js"></script>
</body>
</html>
