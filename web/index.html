<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>삼국지 조조전 (리메이크 엔진)</title>
<style>
  :root { --bar: 64px; --btn-bg: rgba(255,255,255,.10); --btn-bd: rgba(255,255,255,.22); --fg: #e8e8e8; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #screen { aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; touch-action: none;
    width: min(calc(100vw - var(--bar) - env(safe-area-inset-left) - env(safe-area-inset-right)),
               calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 4 / 3)); }
  #bar { width: var(--bar); height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; align-items: center; }
  #bar button { width: 54px; height: 54px; border-radius: 14px; border: 1px solid var(--btn-bd);
    background: var(--btn-bg); color: var(--fg); font-size: 13px; font-weight: 600; line-height: 1.15; padding: 0; touch-action: manipulation; }
  #bar button:active, #bar button.on { background: rgba(255,255,255,.32); }
  #bar #cancel { height: 72px; background: rgba(220,80,80,.25); border-color: rgba(255,120,120,.5); }
  #status { pointer-events: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 15px; text-align: center;
    background: rgba(0,0,0,.7); padding: 14px 20px; border-radius: 12px; border: 1px solid var(--btn-bd); }
  #status:empty { display: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #000;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; font-size: 17px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="screen" width="640" height="480"></canvas>
  <div id="bar">
    <button id="cancel">취소</button>
    <button id="skip">넘기기</button>
    <button id="full">전체<br>화면</button>
  </div>
</div>

<div id="status">불러오는 중…</div>
<div id="rotate"><div style="font-size:56px">📱</div><div>폰을 <b>가로</b>로 돌려주세요</div></div>
<script src="ekd5.js"></script>
</body>
</html>
